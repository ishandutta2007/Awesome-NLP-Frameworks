<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.6; }
      }
      @keyframes pulsePurple {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        50% { transform: scale(1.2) translate(15px, -15px); opacity: 0.55; }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodeFlicker {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 0.9; r: 5; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }

      .animated-cyan-glow {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: 250px 100px;
      }
      .animated-purple-glow {
        animation: pulsePurple 10s ease-in-out infinite;
        transform-origin: 950px 260px;
      }
      .stream-line {
        stroke-dasharray: 12, 18;
        animation: dashStream 16s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 10, 16;
        animation: dashStream 12s linear infinite reverse;
      }
      .node-pulse-1 { animation: nodeFlicker 3s ease-in-out infinite; }
      .node-pulse-2 { animation: nodeFlicker 4s ease-in-out 1.2s infinite; }
      .node-pulse-3 { animation: nodeFlicker 3.5s ease-in-out 0.6s infinite; }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out 1.5s infinite; }
      .particle-3 { animation: floatParticle 7s ease-in-out 3s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Background Animated Ambient Glows -->
  <circle cx="240" cy="90" r="220" fill="url(#glow-cyan)" filter="url(#blur-glow)" class="animated-cyan-glow" />
  <circle cx="960" cy="270" r="240" fill="url(#glow-purple)" filter="url(#blur-glow)" class="animated-purple-glow" />

  <!-- Subtle Futuristic Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Flowing Dynamic Data Waves (Background Layer) -->
  <g opacity="0.4" fill="none">
    <path d="M-50,80 C200,160 400,20 650,90 C900,160 1050,40 1250,110" stroke="#0284c7" stroke-width="1.8" class="stream-line" />
    <path d="M-50,280 C250,210 450,330 700,250 C950,170 1100,290 1250,220" stroke="#8b5cf6" stroke-width="1.8" class="stream-line-rev" />
    <path d="M-50,180 C180,90 380,260 620,170 C860,80 1080,260 1250,160" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" class="stream-line" />
  </g>

  <!-- Interactive Network Graph Nodes (Behind Text Panel) -->
  <g fill="#38bdf8">
    <circle cx="120" cy="110" r="3" class="node-pulse-1" />
    <circle cx="210" cy="240" r="4" class="node-pulse-2" fill="#818cf8" />
    <circle cx="1060" cy="100" r="4" class="node-pulse-3" fill="#a78bfa" />
    <circle cx="1120" cy="230" r="3" class="node-pulse-1" />
    <circle cx="980" cy="70" r="2.5" class="particle-1" fill="#38bdf8" />
    <circle cx="100" cy="290" r="2.5" class="particle-2" fill="#c084fc" />
    <circle cx="1140" cy="160" r="3" class="particle-3" fill="#22d3ee" />
  </g>

  <!-- Foreground Glassmorphism Backing Card (Protects foreground readability) -->
  <rect x="130" y="45" width="940" height="270" rx="20" fill="#090d1a" fill-opacity="0.82" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Header Category Eyebrow Pill -->
  <g transform="translate(435, 75)">
    <rect x="0" y="0" width="330" height="30" rx="15" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="30" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">CURATED NLP ECOSYSTEM • 2026</text>
  </g>

  <!-- Foreground Main Title -->
  <g>
    <text x="600" y="165" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome NLP Frameworks
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g>
    <text x="600" y="208" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Production-Grade Pipelines, Multilingual Transformers &amp; Enterprise NLP at Scale
    </text>
  </g>

  <!-- Bottom Feature Pills in Foreground -->
  <g transform="translate(230, 245)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="0.8" />
    <text x="80" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">⚡ High Throughput</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="0.8" />
    <text x="275" y="22" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🤗 SOTA Transformers</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="0.8" />
    <text x="472.5" y="22" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌐 250+ Languages</text>

    <!-- Pill 4 -->
    <rect x="580" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="0.8" />
    <text x="660" y="22" text-anchor="middle" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🏢 Enterprise SaaS</text>
  </g>
</svg>
